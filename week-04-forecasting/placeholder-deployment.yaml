# Minimal placeholder app -- KEDA needs a real Deployment to scale against.
# nginx is used purely because it's small and starts instantly; it has no
# functional role in the forecasting demo itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forecast-demo-app
  template:
    metadata:
      labels:
        app: forecast-demo-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
