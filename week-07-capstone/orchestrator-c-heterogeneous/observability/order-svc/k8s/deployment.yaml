# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-svc
  labels:
    app: order-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-svc
  template:
    metadata:
      labels:
        app: order-svc
    spec:
      containers:
        - name: order-svc
          image: order-svc:latest
          imagePullPolicy: Never  # image already built locally on the Docker Desktop daemon — never try to pull from a registry
          ports:
            - containerPort: 8080
          # no resource requests/limits set for now — Phase 1 goal is just "runs on K8s";
          # revisit if CPU throttling from limits interferes with the psutil-based measurement (see decisions.md D17)
---
apiVersion: v1
kind: Service
metadata:
  name: order-svc
spec:
  selector:
    app: order-svc
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
